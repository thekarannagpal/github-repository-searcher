services:
  postgres:
    image: postgres:16-alpine
    container_name: github-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: githubsearch
      POSTGRES_USER: githubsearch
      POSTGRES_PASSWORD: githubsearch
    ports:
      - "5432:5432"
    volumes:
      - github-search-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U githubsearch -d githubsearch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  github-search-pgdata:
