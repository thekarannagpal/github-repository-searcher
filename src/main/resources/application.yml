server:
  port: ${PORT:8080}

spring:
  application:
    name: github-repository-searcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:githubsearch}}
    username: ${DB_USER:githubsearch}
    password: ${DB_PASSWORD:githubsearch}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

github:
  api:
    base-url: ${GITHUB_API_URL:https://api.github.com}
    per-page: 20
    token: ${GITHUB_TOKEN:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
