spring:
  datasource:
    url: jdbc:h2:mem:githubsearch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

github:
  api:
    base-url: https://api.github.com
    per-page: 20
    token:
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
